{% extends "base.html" %}
{% block content %}
{% if is_component %}

<!-- ============================= -->
<!-- Component (Web Component Mode) -->
<!-- ============================= -->

<template id="film-search">

    <h2>Film Search</h2>
    <p>Enter a film title to search in Swank or Criterion.</p>

    <!-- Swank Search -->
    <h3>Search Swank</h3>
    <form id="swank-search-form">
        <label for="title_swank">Film Title:</label>
        <input type="text" id="title_swank" name="title" required>
        <button type="submit" class="btn btn-primary">Search Swank</button>
    </form>

    <br><br>

    <!-- Criterion Search -->
    <h3>Search Criterion</h3>
    <form id="criterion-search-form">
        <label for="title_criterion">Film Title:</label>
        <input type="text" id="title_criterion" name="title" required>
        <button type="submit" class="btn btn-secondary">Search Criterion</button>
    </form>

        <h3>Search Criterion</h3>
    <form id="docuseek-search-form" action="{{ url_for('film_search.run_docuseek_search') }}" >
        <form 
      method="POST" 
>
        <label for="title_docuseek">Film Title:</label>
        <input type="text" id="title_docuseek" name="title" required>
        <button type="submit" class="btn btn-secondary">Search Docuseek</button>
    </form>

</template>

{% else %}


<h2>Film Search</h2>
<p>Enter a film title to search in Swank or Criterion.</p>

<!-- Swank Search -->
<h3>Search Swank</h3>
<form action="{{ url_for('film_search.run_search') }}" method="POST"  onsubmit="submitFormWithFetch(event, this)">
    <label for="title_swank">Film Title:</label>
    <input type="text" id="title_swank" name="title" required>
    <button type="submit" class="btn btn-primary">Search Swank</button>
</form>

<br><br>

<!-- Criterion Search -->
<h3>Search Criterion</h3>
<form action="{{ url_for('film_search.run_criterion_search') }}" method="POST" onsubmit="submitFormWithFetch(event, this)">
    <label for="title_criterion">Film Title:</label>
    <input type="text" id="title_criterion" name="title" required>
    <button type="submit" class="btn btn-secondary">Search Criterion</button>
</form>

<!-- Docuseek Search -->
<h3>Search Docuseek</h3>
<form action="{{ url_for('film_search.run_docuseek_search') }}" 
      method="POST" 
      onsubmit="submitFormWithFetch(event, this)">
    <label for="title_criterion">Film Title:</label>
    <input type="text" id="title_docuseek" name="title" required>
    <button type="submit" class="btn btn-secondary">Search Criterion</button>
</form>



{% endif %}
{% endblock %}
