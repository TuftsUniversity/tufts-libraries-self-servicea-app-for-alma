{% extends "base.html" %}

{% block content %}
{% if not is_component %}
<div id="fetch-message" style="display:none; margin-bottom: 1rem;"></div>
<h1 style="color:blue">ALMA PROD</h1>
<h2 style="margin-top: 0;">Bib → Holdings 541</h2>

<form
  id="bib2holdings541-form"
  method="POST"
  action="{{ url_for('bib_2_holdings_541.upload_file', _scheme='https', _external=True) }}"
  enctype="multipart/form-data"
  onsubmit="submitFormWithFetch(event, this)"
>
  <input type="hidden" name="isComponent" value="{{ 'true' if is_component else 'false' }}">

  <div class="form-group" style="margin-bottom: 1rem;">
    <label for="file" style="display:block; font-weight:600;">Input file</label>
    <input id="file" name="file" type="file" required>
  </div>

  <div class="form-group" style="margin-bottom: 1rem;">
    <label for="email" style="display:block; font-weight:600;">Email for results</label>
    <input id="email" name="email" type="email" required placeholder="you@tufts.edu">
  </div>

  <div class="form-group" style="margin-bottom: 1rem;">
    <label style="display:flex; gap:0.5rem; align-items:center;">
      <input type="checkbox" name="email_as_attachment" value="true">
      Email results as attachment (ZIP)
    </label>
  </div>

  <button type="submit" class="btn btn-primary">
    <i class="fa fa-upload"></i> Submit
  </button>
</form>
{% else %}
<template id="bib-2-holdings-541">
<div id="fetch-message" style="display:none; margin-bottom: 1rem;"></div>
<h1 style="color:blue">ALMA PROD</h1>
<h2 style="margin-top: 0;">Bib → Holdings 541</h2>

<form
  id="uploadForm"
  action="/bib_2_holdings_541/upload" 
  method="post" 
  enctype="multipart/form-data"
  
>
<input type="hidden" name="isComponent" value="true">
  <div class="form-group" style="margin-bottom: 1rem;">
    <label for="file" style="display:block; font-weight:600;">Input file</label>
    <input id="file" name="file" type="file" required>
  </div>

  <div class="form-group" style="margin-bottom: 1rem;">
    <label for="email" style="display:block; font-weight:600;">Email for results</label>
    <input id="email" name="email" type="email" required placeholder="you@tufts.edu">
  </div>

  <div class="form-group" style="margin-bottom: 1rem;">
    <label style="display:flex; gap:0.5rem; align-items:center;">
      <input type="checkbox" name="email_as_attachment" value="true">
      Email results as attachment (ZIP)
    </label>
  </div>

  <button type="submit" class="btn btn-primary">
    <i class="fa fa-upload"></i> Submit
  </button>
</form>
</template>
{% endif %}
{% endblock %}
